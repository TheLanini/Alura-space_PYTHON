
name: CI - Alura Space Django

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Verificar projeto Django
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: alura-space-main

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: alura-space-main/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar Django
        run: python manage.py check

      - name: Executar testes
        run: python manage.py test
